<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
header{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #334155}
header h1{font-size:16px;color:#38bdf8}
header span{font-size:12px;color:#64748b}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#2563eb;color:#fff}
.msg.hermes{align-self:flex-start;background:#1e293b;border:1px solid #334155}
footer{padding:12px 20px;background:#1e293b;display:flex;gap:10px;border-top:1px solid #334155}
footer input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none}
footer input:focus{border-color:#38bdf8}
footer button{padding:10px 20px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
footer button:disabled{opacity:.5}
.loading{color:#64748b;font-style:italic}
</style>
</head>
<body>
<header><h1>Hermes Chat</h1><span>pmlophy.com</span></header>
<div id="messages"><div class="msg hermes">你好，我是杰西卡。有什么可以帮你的？</div></div>
<footer>
  <input id="input" placeholder="输入..." autofocus onkeydown="if(event.key==='Enter')send()">
  <button id="btn" onclick="send()">发送</button>
</footer>
<script>
async function send(){
  const i=document.getElementById('input'),b=document.getElementById('btn'),m=document.getElementById('messages');
  const msg=i.value.trim();if(!msg)return;
  i.value='';b.disabled=true;
  m.insertAdjacentHTML('beforeend',`<div class="msg user">${e(msg)}</div>`);
  m.insertAdjacentHTML('beforeend',`<div class="msg hermes loading">...</div>`);
  m.scrollTop=m.scrollHeight;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json();
    m.lastElementChild.classList.remove('loading');
    m.lastElementChild.textContent=d.reply||'...';
  }catch(x){
    m.lastElementChild.classList.remove('loading');
    m.lastElementChild.textContent='出错了: '+x.message;
  }
  b.disabled=false;i.focus();m.scrollTop=m.scrollHeight;
}
function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
